<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壽山動物園線上動物園｜施工中</title>
<style>
body{margin:0;background:#f2f5ed;color:#254333;font-family:system-ui,sans-serif;line-height:1.8}
main{max-width:40rem;margin:10vh auto;padding:2rem}h1{font-size:clamp(1.7rem,5vw,2.6rem)}
li{padding:.4rem}section[hidden]{display:none}
</style>
<main><h1>壽山動物園線上動物園</h1><p>施工中，期待與你在線上相見。</p>
<section id="areas" hidden><h2>展區預告</h2><ul id="list"></ul></section></main>
<script>
fetch('data/areas.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(rows=>{
  if(!Array.isArray(rows))return;
  for(const row of rows){if(typeof row['名稱']!=='string'||!row['名稱'].trim())continue;
    const li=document.createElement('li');li.textContent=row['名稱'];document.getElementById('list').append(li);}
  if(document.getElementById('list').children.length)document.getElementById('areas').hidden=false;
}).catch(()=>{});
</script>
</html>
